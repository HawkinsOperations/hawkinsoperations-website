name: Public Status Convergence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_visual:
        description: "Install Chromium and run Playwright visual QA."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

concurrency:
  group: public-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-status-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hawkinsoperations-website
    steps:
      - name: Checkout Website event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hawkinsoperations-website
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hawkinsoperations-website/package-lock.json

      - name: Resolve reviewed immutable source selection
        id: manifest
        run: node scripts/resolve-public-status-checkouts.mjs --github-output

      - name: Checkout .github reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/.github
          ref: ${{ steps.manifest.outputs.org }}
          path: .github
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout hoxline reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hoxline
          ref: ${{ steps.manifest.outputs.hoxline }}
          path: hoxline
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout hawkinsoperations-detections reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-detections
          ref: ${{ steps.manifest.outputs.hawkinsoperations_detections }}
          path: hawkinsoperations-detections
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout hawkinsoperations-validation reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-validation
          ref: ${{ steps.manifest.outputs.hawkinsoperations_validation }}
          path: hawkinsoperations-validation
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout hawkinsoperations-platform reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-platform
          ref: ${{ steps.manifest.outputs.hawkinsoperations_platform }}
          path: hawkinsoperations-platform
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout hawkinsoperations-proof reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-proof
          ref: ${{ steps.manifest.outputs.hawkinsoperations_proof }}
          path: hawkinsoperations-proof
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Verify exact source checkouts
        run: npm run public-status:source-checkout-test

      - name: Reproduce checked public status without mutation
        run: npm run public-status:generate:check

      - name: Verify public status and owner linkage
        run: npm run public-status:verify

      - name: Attack reviewed checkout identity
        run: npm run public-status:checkout-manifest-self-test

      - name: Attack malformed data and nested claims
        run: npm run public-status:self-test

      - name: Check site contract
        run: npm run check:site

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Verify generated pair remained unchanged
        run: git diff --exit-code -- public/data/public-status.json src/data/generated/public-status.generated.ts

      - name: Install Playwright Chromium
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_visual }}
        run: npx playwright install chromium

      - name: Run visual QA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_visual }}
        run: npm run test:visual
