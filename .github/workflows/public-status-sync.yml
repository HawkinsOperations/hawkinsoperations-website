name: Public status convergence

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_visual:
        description: "Install Chromium and run Playwright visual QA."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

env:
  HAWKINS_WEBSITE_IMMUTABLE_OBSERVED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HAWKINS_REVIEWED_SOURCE_MANIFEST_SHA: b87acd4487ff779bc0cb8b96c783ada0d712a0ed

jobs:
  public-status-convergence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hawkinsoperations-website
    steps:
      - name: Checkout website event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hawkinsoperations-website
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout reviewed source manifest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/.github
          ref: ${{ env.HAWKINS_REVIEWED_SOURCE_MANIFEST_SHA }}
          path: .github
          fetch-depth: 0
          persist-credentials: false

      - name: Read content and reviewed-head manifests
        id: manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { strictJsonParse } from "./scripts/strict-json.mjs";
          const contentManifest = strictJsonParse(
            fs.readFileSync("config/public-status-source-manifest-v1.json", "utf8"),
            "config/public-status-source-manifest-v1.json",
          );
          const reviewedManifest = strictJsonParse(
            fs.readFileSync("../.github/governance/CONVERGENCE_SOURCE_MANIFEST.json", "utf8"),
            "../.github/governance/CONVERGENCE_SOURCE_MANIFEST.json",
          );
          const names = {
            "HawkinsOperations/.github": "org",
            "HawkinsOperations/hoxline": "hoxline",
            "HawkinsOperations/hawkinsoperations-detections": "detections",
            "HawkinsOperations/hawkinsoperations-validation": "validation",
            "HawkinsOperations/hawkinsoperations-platform": "platform",
            "HawkinsOperations/hawkinsoperations-proof": "proof"
          };
          const contentEntries = Object.fromEntries(
            contentManifest.repositories.map((entry) => [entry.repository, entry]),
          );
          const reviewedEntries = Object.fromEntries(
            reviewedManifest.repositories.map((entry) => [entry.canonical_repository, entry]),
          );
          if (contentManifest.manifest_version !== "public-status-source-manifest-v1" ||
              contentManifest.observation_kind !== "reviewed_immutable_commit" ||
              contentManifest.repositories.length !== 7 ||
              Object.keys(contentEntries).length !== 7 ||
              reviewedManifest.schema !== "hawkinsoperations-convergence-source-manifest-v1" ||
              reviewedManifest.constraints?.exact_repository_count !== 7 ||
              reviewedManifest.repositories.length !== 7 ||
              Object.keys(reviewedEntries).length !== 7) {
            throw new Error("invalid or duplicate content/reviewed-head manifest");
          }
          const website = contentEntries["HawkinsOperations/hawkinsoperations-website"];
          if (!website || !/^[a-f0-9]{40}$/.test(website.revision ?? "")) {
            throw new Error("website source must bind an explicit reviewed content revision");
          }
          const lines = [];
          for (const [repo, output] of Object.entries(names)) {
            const content = contentEntries[repo];
            const reviewed = reviewedEntries[repo];
            const revision = repo === "HawkinsOperations/.github"
              ? process.env.HAWKINS_REVIEWED_SOURCE_MANIFEST_SHA
              : reviewed?.revision;
            if (!content ||
                !reviewed ||
                !/^[a-f0-9]{40}$/.test(content.revision ?? "") ||
                !/^[a-f0-9]{40}$/.test(revision ?? "")) {
              throw new Error(`invalid immutable content/reviewed revision for ${repo}`);
            }
            lines.push(`${output}=${revision}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join("\n")}\n`);
          NODE

      - name: Checkout Hoxline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hoxline
          ref: ${{ steps.manifest.outputs.hoxline }}
          path: hoxline
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout detections
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-detections
          ref: ${{ steps.manifest.outputs.detections }}
          path: hawkinsoperations-detections
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-validation
          ref: ${{ steps.manifest.outputs.validation }}
          path: hawkinsoperations-validation
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout platform
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-platform
          ref: ${{ steps.manifest.outputs.platform }}
          path: hawkinsoperations-platform
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout proof
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-proof
          ref: ${{ steps.manifest.outputs.proof }}
          path: hawkinsoperations-proof
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hawkinsoperations-website/package-lock.json

      - name: Install declared dependencies
        run: npm ci

      - name: Reproduce checked public status
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run public-status:generate:check

      - name: Refresh scheduled public status observation
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run public-status:generate

      - name: Verify public status
        run: npm run public-status:verify

      - name: Verify source owner contracts
        run: npm run public-status:owner-self-test

      - name: Run hostile public-status suite
        run: npm run public-status:self-test

      - name: Verify exact source checkouts
        run: npm run public-status:source-checkout-test

      - name: Verify freshness and revision reachability
        run: npm run public-status:freshness-reachability-test

      - name: Verify dirty provenance rejection
        run: npm run public-status:dirty-provenance-test

      - name: Verify nested claim rejection
        run: npm run public-status:nested-claim-test

      - name: Verify duplicate-key rejection
        run: npm run public-status:strict-json-test

      - name: Verify CRLF and LF identity separation
        run: npm run public-status:eol-self-test

      - name: Check site contract
        run: npm run check:site

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Verify generated pair is reproducible
        run: git diff --exit-code -- public/data/public-status.json src/data/generated/public-status.generated.ts

      - name: Install Playwright Chromium
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_visual }}
        run: npx playwright install chromium

      - name: Run visual QA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_visual }}
        run: npm run test:visual
